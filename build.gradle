plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'


            // History Mode maps are versioned in the repository instead of living inside run/.
            property 'bleachmod.mapsDir', project.file('history-maps').absolutePath

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            if (providers.gradleProperty('storyQuestQa').map { it.toBoolean() }.getOrElse(false)) {
                workingDirectory project.file('run/story-quest-qa')
                property 'bleachmod.storyQuestQa', 'true'
                args '--width', '1280', '--height', '720'
            }
            if (providers.gradleProperty('questNavigationQa').map { it.toBoolean() }.getOrElse(false)) {
                workingDirectory project.file('run/quest-navigation-qa')
                property 'bleachmod.questNavigationQa', 'true'
                args '--width', '1280', '--height', '720'
            }
            if (providers.gradleProperty('questHudQa').map { it.toBoolean() }.getOrElse(false)) {
                workingDirectory project.file('run/quest-hud-qa')
                property 'bleachmod.questHudQa', 'true'
                args '--width', '1280', '--height', '720'
            }
            if (providers.gradleProperty('classSelectionQa').map { it.toBoolean() }.getOrElse(false)) {
                workingDirectory project.file('run/class-selection-qa')
                property 'bleachmod.classSelectionQa', 'true'
                args '--width', '1280', '--height', '720'
            }
            if (providers.gradleProperty('bossQa').map { it.toBoolean() }.getOrElse(false)) {
                workingDirectory project.file('run/boss-qa/base')
                property 'bleachmod.bossQa', 'true'
                property 'bleachmod.bossQaExit', providers.gradleProperty('bossQaExit').getOrElse('false')
                args '--width', '1280', '--height', '720'
            }
            if (providers.gradleProperty('hollowQa').map { it.toBoolean() }.getOrElse(false)) {
                workingDirectory project.file('run/hollow-qa/aerial')
                property 'bleachmod.hollowQa', 'true'
                property 'bleachmod.hollowQaExit', providers.gradleProperty('hollowQaExit').getOrElse('false')
                property 'bleachmod.hollowGaitQa', providers.gradleProperty('hollowGaitQa').getOrElse('false')
                args '--width', '1280', '--height', '720'
            }
            if (providers.gradleProperty('benihimeQa').map { it.toBoolean() }.getOrElse(false)) {
                workingDirectory project.file(providers.gradleProperty('photonPilot').map { it.toBoolean() }.getOrElse(false) ? 'run-benihime-qa/photon' : 'run-benihime-qa/base')
                property 'bleachmod.benihimeQa', 'true'
                property 'bleachmod.cinematicQa', providers.gradleProperty('cinematicQa').getOrElse('false')
                property 'bleachmod.higashiPoseQa', providers.gradleProperty('higashiPoseQa').getOrElse('false')
                property 'bleachmod.benihimeMeleeQa', providers.gradleProperty('benihimeMeleeQa').getOrElse('false')
                property 'bleachmod.benihimeCombatQa', providers.gradleProperty('benihimeCombatQa').getOrElse('false')
                property 'bleachmod.ryujinQa', providers.gradleProperty('ryujinQa').getOrElse('false')
                property 'bleachmod.hyorinmaruQa', providers.gradleProperty('hyorinmaruQa').getOrElse('false')
                property 'bleachmod.qaAutoExit', providers.gradleProperty('qaAutoExit').getOrElse('false')
                property 'bleachmod.cinematicQaFast', providers.gradleProperty('cinematicQaFast').getOrElse('false')
                property 'bleachmod.benihimeStageQa', providers.gradleProperty('benihimeStageQa').getOrElse('false')
                args '--width', '1280', '--height', '720'
            }
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id

            // Keep the userdev client responsive on 16 GB development machines while the
            // Gradle launcher remains alive. G1 favors short pauses over a large elastic heap.
            jvmArgs '-Xms512m', '-Xmx2G', '-XX:+UseG1GC', '-XX:MaxGCPauseMillis=50'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            if (providers.gradleProperty('storyQuestQa').map { it.toBoolean() }.getOrElse(false)) {
                workingDirectory project.file('run-gametest/story-quest-start')
            } else {
            // Keep optional-mod registry entries out of the baseline test save.
            workingDirectory project.file(providers.gradleProperty('bossQa').map { it.toBoolean() }.getOrElse(false) ? 'run-gametest/boss-remaster' : (providers.gradleProperty('photonPilot').map { it.toBoolean() }.getOrElse(false) ? 'run-gametest/photon' : 'run-gametest/base'))
            }
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    flatDir {
        name = 'ValidationMods'
        dirs 'run/validation-dependencies'
    }
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'MinecraftLibraries'
        url = 'https://libraries.minecraft.net/'
    }
    maven {
        // PlayerAnimator (KosmX): keyframed full-body player animations for release cinematics.
        name = 'KosmX'
        url = 'https://maven.kosmx.dev/'
    }
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }

    // Put additional repositories for dependencies here.
    // ForgeGradle also adds the Forge maven and Maven Central, but keeping them
    // explicit makes fresh IDE imports more predictable.

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    // flatDir {
    //     dir 'libs'
    // }
}

// Client mixins (character appearance). The plugin adds the config to every run and writes the refmap.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

configurations { combatRuntimeArtifacts { transitive = false } }
configurations { photonPilotArtifacts { transitive = false } }
def photonPilotEnabled = providers.gradleProperty('photonPilot').map { it.toBoolean() }.getOrElse(false)

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // Optional VFX laboratory. Base pack stays at five jars; -PphotonPilot=true enables runtime.
    compileOnly fg.deobf("maven.modrinth:photon-editor:a7chTVuf")
    compileOnly fg.deobf("maven.modrinth:ldlib:ONxYJpRz")
    photonPilotArtifacts "maven.modrinth:photon-editor:a7chTVuf"
    photonPilotArtifacts "maven.modrinth:ldlib:ONxYJpRz"
    if (photonPilotEnabled) {
        runtimeOnly fg.deobf("maven.modrinth:photon-editor:a7chTVuf")
        runtimeOnly fg.deobf("maven.modrinth:ldlib:ONxYJpRz")
    }
    implementation fg.deobf("maven.modrinth:geckolib:aC5KMoNg")
    combatRuntimeArtifacts "maven.modrinth:geckolib:aC5KMoNg"
    implementation fg.deobf("maven.modrinth:better-combat:${better_combat_version}")
    implementation fg.deobf("maven.modrinth:playeranimator:${player_animator_version}")
    implementation fg.deobf("maven.modrinth:cloth-config:${cloth_config_version}")
    combatRuntimeArtifacts "maven.modrinth:better-combat:${better_combat_version}"
    combatRuntimeArtifacts "maven.modrinth:playeranimator:${player_animator_version}"
    combatRuntimeArtifacts "maven.modrinth:cloth-config:${cloth_config_version}"
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Required at runtime by the modpack: body animations for Zanpakuto release cinematics.
    // PlayerAnimator is supplied once through the pinned Modrinth Forge artifact above.

    // WorldEdit is used to validate generated schematics in the development client.
    // ForgeGradle must remap the published mod jar to the userdev mappings.
    // Opt-in (validationWorldEdit=true) and only when the local jar exists: run/ is gitignored, and a
    // missing jar breaks the whole deobf configuration (PlayerAnimator included).
    def worldEditJar = file('run/validation-dependencies/worldedit-mod-7.2.15.jar')
    if (providers.gradleProperty("validationWorldEdit").map { it.toBoolean() }.getOrElse(false)) {
        if (worldEditJar.exists()) {
            runtimeOnly fg.deobf("local:worldedit-mod:7.2.15")
        } else {
            logger.warn("validationWorldEdit=true but ${worldEditJar} is missing; running without WorldEdit.")
        }
    }

    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    from('Docs/poderes/licencas/71-audios-fornecidos-benihime.md') {
        into 'META-INF/licenses'
        rename { 'benihime-user-audio.txt' }
    }
    from('Docs/poderes/licencas/69-voz-benihime-mei.md') {
        into 'META-INF/licenses'
        rename { 'benihime-voice.txt' }
    }
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Small offline regression suite: no external test framework download required.
tasks.register('regressionTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.bleachmod.MvpRegressionTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}
tasks.named('check') { dependsOn tasks.named('regressionTest') }


// External original jars, not deobfuscated development artifacts, ready for the pilot installation.
tasks.register('prepareCombatTestPack', Copy) {
    dependsOn tasks.named('build')
    from configurations.combatRuntimeArtifacts
    from tasks.named('jar')
    into layout.buildDirectory.dir('combat-test-pack/mods')
}

tasks.register('preparePhotonTestPack', Sync) {
    dependsOn tasks.named('build')
    from(configurations.combatRuntimeArtifacts) { into 'mods' }
    from(configurations.photonPilotArtifacts) { into 'mods' }
    from(tasks.named('jar')) { into 'mods' }
    from('src/photonPilot/config') { into 'config' }
    into layout.buildDirectory.dir('photon-test-pack')
}
